name: Release

# Pushing a tag like v0.2.0 builds the extension and publishes a GitHub Release.
on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, so the tagged commit can be checked against main.
          fetch-depth: 0
          # Later steps never get a token that can push to the repository.
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Verify the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$version" != "$pkg_version" ]; then
            echo "::error::Tag $TAG does not match package.json version $pkg_version"
            exit 1
          fi
          if ! grep -qF "## [$version]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$version]' section"
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Tagged commit $(git rev-parse HEAD) is not on main"
            exit 1
          fi
      - run: npm ci
      - run: npm run check
      - run: npm run zip
      - name: Prepare release files
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          zip_file="$(ls .output/*.zip)"
          if [ "$(printf '%s\n' "$zip_file" | wc -l)" -ne 1 ]; then
            echo "::error::Expected exactly one zip in .output, found: $zip_file"
            exit 1
          fi
          (cd .output && sha256sum "$(basename "$zip_file")" > "$(basename "$zip_file").sha256")
          # Release notes: the CHANGELOG section for this version, without its heading line.
          awk -v header="## [$version]" '
            index($0, header) == 1 { found = 1; next }
            found && index($0, "## [") == 1 { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::The CHANGELOG section for $version is empty"
            exit 1
          fi
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" .output/*.zip .output/*.sha256 \
            --title "$TAG" \
            --notes-file notes.md \
            --verify-tag
