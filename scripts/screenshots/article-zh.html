<title>慢慢读</title>
<style>
  body { margin: 0; background: #fbfaf7; color: #1f1d1a; font: 18px/1.8 "Songti SC", "Noto Serif SC", "Source Han Serif SC", serif; }
  header.site { border-bottom: 1px solid #ebe7df; padding: 14px 32px; font: 600 14px/1 -apple-system, "PingFang SC", system-ui, sans-serif; letter-spacing: .12em; color: #6b655b; }
  main { max-width: 680px; margin: 0 auto; padding: 40px 24px 80px; }
  .kicker { font: 600 12px/1 -apple-system, "PingFang SC", system-ui, sans-serif; letter-spacing: .2em; color: #b4772a; }
  h1 { font-size: 40px; line-height: 1.2; margin: 12px 0 10px; }
  .byline { font: 14px/1.4 -apple-system, "PingFang SC", system-ui, sans-serif; color: #7a746a; margin-bottom: 28px; }
  p { margin: 0 0 20px; }
  a { color: #8a5a1c; }
  blockquote { margin: 28px 0; padding-left: 18px; border-left: 3px solid #e2c48e; color: #4a453d; }
</style>

<body>
<header class="site">设计札记</header>
<main>
  <div class="kicker">随笔</div>
  <h1>慢慢读</h1>
  <div class="byline">林知秋 · 约 5 分钟</div>
  <p>好用的工具往往让人感觉不到它的存在。你专心做事的时候，它安静地待在一旁；你伸手去找，它刚好就在那里。</p>
  <p>用外语读文章最能说明这一点。读者需要的是有人帮一把，而不是把整页换成另一种语言，连作者的语气也一起换掉。帮助最好<a href="#notes">就放在原文旁边</a>，两相对照，边读边学。</p>
  <blockquote>每一次打断都有代价。体贴的工具花用你的注意力，就像花自己的钱一样谨慎。</blockquote>
  <p>有时候挡住去路的只是一个词。查它的意思和读音，应该瞥一眼就够，不必绕道打开另一个网站。</p>
  <p>页面很长的时候，翻译应该跟着阅读走，而不是一口气跑到最后。眼前这一屏先译好，往下翻，后面的再慢慢跟上。</p>
</main>
</body>
